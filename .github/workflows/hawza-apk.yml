name: Hawza Android build

on:
  push:
    branches: [main]
    paths:
      - 'hawza/**'
      - 'hawza-android/**'
      - '.github/workflows/hawza-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hawza-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - run: python3 hawza-android/prepare.py
      - name: Build test APK
        run: gradle -p hawza-android :app:assembleDebug --no-daemon --stacktrace
      - name: Commit APK
        run: |
          D=hawza-android/dist
          mkdir -p $D
          cp hawza-android/app/build/outputs/apk/debug/app-debug.apk $D/hawza-test.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $D
          git commit -m "بناء نسخة تجربة لمنصة الحوزة [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
