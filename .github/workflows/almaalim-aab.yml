name: Almaalim Android build

on:
  push:
    branches: [main]
    paths:
      - 'almaalim-android/**'
      - '.github/workflows/almaalim-aab.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: almaalim-aab
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }

      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      # نسخ تطبيق الويب من almaalim/ وحفظ الخطوط داخله
      - run: python3 almaalim-android/prepare.py

      - name: Build bundle and test APK
        run: gradle -p almaalim-android :app:bundleRelease :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: almaalim-android
          path: |
            almaalim-android/app/build/outputs/bundle/release/app-release.aab
            almaalim-android/app/build/outputs/apk/debug/app-debug.apk

      # تُحفظ المخرجات في المستودع ليُوقَّع الحزمة بعدها بمفتاح الرفع
      - name: Commit outputs
        run: |
          D=almaalim-android/dist
          mkdir -p $D
          cp almaalim-android/app/build/outputs/bundle/release/app-release.aab $D/almaalim-unsigned.aab
          cp almaalim-android/app/build/outputs/apk/debug/app-debug.apk $D/almaalim-test.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $D
          git commit -m "بناء حزمة أندرويد للمعالم الناضرة [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
