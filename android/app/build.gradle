plugins {
    id 'com.android.application'
}

android {
    namespace 'org.daralemaam.mawarith'
    compileSdk 36

    defaultConfig {
        applicationId 'org.daralemaam.mawarith'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
    }
}
