plugins {
    id 'com.android.application'
}

android {
    namespace 'org.daralemaam.mawarith'
    compileSdk 36

    defaultConfig {
        applicationId 'org.daralemaam.mawarith'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    // تحديث التطبيق من داخل التطبيق عبر Google Play
    implementation 'com.google.android.play:app-update:2.1.0'
}
